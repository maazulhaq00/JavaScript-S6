<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Learning Inc / dec</h2>

    <script>
        let age = 13;
        console.log(age); // 13

        age--
        console.log(age); // 12

        age--
        console.log(age); // 11

        age++
        console.log(age); // 12

        age += 2
        console.log(age); // 14

        age /= 7  // age = age / 7
        console.log(age); // 2

        age **= 3 // age = age ** 3
        console.log(age); // 8

        let a = 19
        let b = 4
        console.log(a == b) // f
        console.log(a > b) // t
        console.log(a >= b) // t
        console.log(a < b) // f
        console.log(a != b) // t

        console.log( "2" == 2 ) // t 
        console.log( "2" === 2 ) // f
        
        console.log( "2" != 2 ) // f 
        console.log( "2" !== 2 ) // t
</script>

</body>
</html>
