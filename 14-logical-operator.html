<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h3>Learning Logical Operators</h3>



    <script>

        let a = 3

        console.log(a > 0 && a < 10) // T AND T // T
        console.log(a > 10 && a < 20) // F AND T // F
        console.log(a < 0 && a > 20) // F AND F // F

        console.log(a > 0 || a < 10) // T OR T // T
        console.log(a > 10 || a < 20) // F OR T // T
        console.log(a < 0 || a > 20) // F OR F // F

    </script>


</body>


</html>
