<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Learning Functions</h3>

    <button onclick="greet()" >Say Hello</button> <br>


    <script>
        // alert("hello world")


        // function definition
        function greet() {
            alert("Hello World")
        }

        // function call
        // greet()


        function greet2(name, age) {
            document.write("Hello " + name + ". You are " + age + " years old. <br>")
        }

        greet2("Abeer", 16)
        greet2("Ali", 18)
        greet2("Khadija", 17)
        greet2("Alishba", 17)



    </script>
</body>
</html>
